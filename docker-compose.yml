services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: lbc
      POSTGRES_PASSWORD: lbc
      POSTGRES_DB: landlords_bc
    ports:
      - "5432:5432"
    volumes:
      - lbc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lbc -d landlords_bc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lbc_pg:
